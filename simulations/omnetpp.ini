[General]
network = omada_10.simulations.PacketQueueTutorialStep
sim-time-limit = 20s
record-eventlog = true
**.producer.packetLength = 1KiB
**.producer.numPackets = -1

# --- ΠΕΙΡΑΜΑ 1: Επίδραση Ρυθμού Παραγωγής ---

[Config Exp1_Fast_Production]
description = "Ουρά υπερφορτωμένη"
*.producer.productionInterval = uniform(0.01s, 0.02s)
*.queue.packetCapacity = 5
*.collector.collectionInterval = 0.5s

[Config Exp1_Base_Production]
description = "Ισορροπημένη κατάσταση"
*.producer.productionInterval = uniform(0.1s, 0.3s)
*.queue.packetCapacity = 5
*.collector.collectionInterval = 0.2s

[Config Exp1_Slow_Production]
description = "Ουρά άδεια - Καθόλου Drops"
*.producer.productionInterval = uniform(0.5s, 1.0s)
*.queue.packetCapacity = 5
*.collector.collectionInterval = 0.1s

# --- ΠΕΙΡΑΜΑ 2: Επίδραση Χωρητικότητας Ουράς ---
# Όλα αυτά κληρονομούν το "Fast_Production", άρα θα έχουν Drops
[Config Exp2_Small_Capacity]
extends = Exp1_Fast_Production
description = "Πολύ μικρή ουρά"
*.queue.packetCapacity = 2

[Config Exp2_Medium_Capacity]
extends = Exp1_Fast_Production
description = "Μεσαία ουρά"
*.queue.packetCapacity = 10

[Config Exp2_Large_Capacity]
extends = Exp1_Fast_Production
description = "Μεγάλη ουρά"
*.queue.packetCapacity = 50